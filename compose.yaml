# Ontos — full stack.
#
#   cp .env.example .env    # fill in the four secrets
#   docker compose up --build
#
# Services
#   db      MySQL 8.4 LTS, data in the `db-data` volume
#   engine  open-ontologies semantic engine (OWL-RL, SHACL, SPARQL over Oxigraph)
#   init    one-shot: migrations, first-boot demo seed, admin account
#   app     the Ontos server and web client, on ${ONTOS_PORT:-3000}
#
# Images are pinned by digest so a rebuild months from now produces the same
# stack. Bump the tag and digest together.

name: ontos

x-app-env: &app-env
  NODE_ENV: production
  DATABASE_URL: mysql://ontos:${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}@db:3306/ontos
  APP_SECRET: ${APP_SECRET:?set APP_SECRET in .env (32+ random characters)}
  ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@acme-ontology.com}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env (12+ characters)}
  ALLOW_DEMO_LOGIN: ${ALLOW_DEMO_LOGIN:-false}
  ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
  OPEN_ONTOLOGIES_URL: http://engine:8085
  IOT_BROKER_URL: ${IOT_BROKER_URL:-}
  IOT_BROKER_TYPE: ${IOT_BROKER_TYPE:-}
  IOT_BROKER_TOPIC: ${IOT_BROKER_TOPIC:-}
  IOT_WEBHOOK_API_KEY: ${IOT_WEBHOOK_API_KEY:-}
  IOT_WORKSPACE_ID: ${IOT_WORKSPACE_ID:-}

# No `image:` name on the services built from this: compose names each image
# after the project, so two stacks started with different -p names never
# overwrite each other's image.
x-app-build: &app-build
  context: ./app

services:
  db:
    image: mysql:8.4@sha256:85b9bf2e29cf836ecb8c2a15a935d4ba0c606631dff1dd79531a11983c638f2a
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ontos
      MYSQL_USER: ontos
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      # TCP, not the socket: during first-boot initialisation MySQL runs a
      # temporary server with networking disabled, and only the real server
      # should count as healthy. mysqladmin ping needs no credentials for this.
      test: ["CMD", "mysqladmin", "ping", "--host=127.0.0.1", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  engine:
    image: ghcr.io/fabio-rovai/open-ontologies:1.3.0@sha256:db7a7e0f03ae7c3df4649c81d438a0952033abe4b524d3cd84d59dd617e4207a
    restart: unless-stopped
    # The image defaults to `serve` (MCP over stdio), which exits at once with
    # no stdin attached. serve-http keeps the HTTP API in the foreground.
    command: ["serve-http", "--host", "0.0.0.0", "--port", "8085"]
    user: "65534:65534"
    environment:
      HOME: /tmp
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      # SHACL shapes arrive as files the app writes here; the engine only reads.
      - shacl-exchange:/exchange:ro
    # No healthcheck, deliberately. The image is distroless — no shell, no
    # curl — and its `status` subcommand reports ok even when no server is
    # running, so it cannot tell live from dead. The app treats the engine as
    # optional and reports its real reachability at /health.

  init:
    build: *app-build
    command: ["node", "dist/db/bootstrap.js"]
    environment: *app-env
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    build: *app-build
    restart: unless-stopped
    ports:
      - "${ONTOS_PORT:-3000}:3000"
    environment:
      <<: *app-env
      SHACL_EXCHANGE_DIR: /exchange
    volumes:
      - shacl-exchange:/exchange
    depends_on:
      init:
        condition: service_completed_successfully
      engine:
        condition: service_started

volumes:
  db-data:
  # A small in-memory directory shared by app and engine. The engine takes SHACL
  # shapes only as a file path, so the two containers need one place both can
  # see. uid/gid 1000 is the `node` user the app image runs as, so the app can
  # write; mode 0755 lets the engine's unprivileged user read.
  shacl-exchange:
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "uid=1000,gid=1000,mode=0755,size=16m"
