name: Gate

# Ontos under the PRO-THESIS gate (gate/README.md). The tool is pinned: a
# different version may change verdicts. Exit codes are the product: 0 pass,
# 1 an oracle proved a violation, 2 nothing proven, 4 the locked test moved.

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

env:
  THESIS_VERSION: v0.1.0-phase0

jobs:
  gate:
    name: PRO-THESIS gate (smoke, stranded sync job)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: gate/go.mod
          cache-dependency-path: gate/go.sum

      - name: Install thesis (pinned)
        run: |
          go install "github.com/WrdCstlg/pro-thesis/cmd/thesis@${THESIS_VERSION}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          "$(go env GOPATH)/bin/thesis" version

      # Before any image is built or world runs: a moved oracle definition or
      # covered config key is exit 4, "someone changed the test".
      - name: Verify the oracle lock
        working-directory: gate
        run: thesis oracles verify

      - name: Build the images under test
        run: |
          tag="${GITHUB_SHA::7}"
          echo "ONTOS_GATE_TAG=$tag" >> "$GITHUB_ENV"
          pwsh -NoProfile -File gate/scripts/build-images.ps1 -Tag "$tag"

      - name: Test the driver and oracles
        working-directory: gate
        run: go test ./...

      - name: Build the driver and oracle
        run: pwsh -NoProfile -File gate/scripts/build-tools.ps1

      - name: Smoke (3 worlds, no faults)
        working-directory: gate
        run: thesis run --profile smoke

      # Pre-registered in gate/.prothesis/PREREGISTRATION.md, recorded in
      # gate/observations/2026-09-24-OBS-GATE-001.md. Passes since a27b351.
      - name: Stranded sync job (app restarted mid-import)
        working-directory: gate
        run: thesis run --profile stuckjob --fault 'proc.restart(app)@3000..9000'

      # Pre-registrations 2 to 4. Both worker faults start at 4 s, when worker-a
      # is holding its first bulk import; the pause is long enough for worker-b
      # to finish its own import and reach worker-a's lapsed lease.
      - name: Worker restarted under a backlog
        working-directory: gate
        run: thesis run --profile workers --fault 'proc.restart(worker-a)@4000..10000'

      - name: Worker frozen past its lease
        working-directory: gate
        run: thesis run --profile workers --fault 'proc.pause(worker-a)@4000..40000'

      # Pre-registration 6: action types, their record and their side effects.
      - name: Actions
        working-directory: gate
        run: thesis run --profile actions

      - name: App restarted mid-submission
        working-directory: gate
        run: thesis run --profile actions --fault 'proc.restart(app)@4000..10000'

      - name: Database restarted under actions
        working-directory: gate
        run: thesis run --profile actions --fault 'proc.restart(db)@5000..12000'

      # Pre-registration 8: a signed-in client is never told it is signed out,
      # with requests in flight through the whole outage.
      - name: Signed-in clients across a database restart
        working-directory: gate
        run: thesis run --profile sessions --fault 'proc.restart(db)@5000..12000'

      # Pre-registration 9 (increment 3): every action submission acknowledged
      # through the Ontology API is visible, as applied, to the client's next
      # read of its objects through the API.
      - name: Ontology API
        working-directory: gate
        run: thesis run --profile api

      - name: App restarted under the Ontology API
        working-directory: gate
        run: thesis run --profile api --fault 'proc.restart(app)@4000..10000'

      - name: Database restarted under the Ontology API
        working-directory: gate
        run: thesis run --profile api --fault 'proc.restart(db)@5000..12000'

      # Every run of this job is in .prothesis/runs, and nothing else: the
      # directory is not committed, and the pinned thesis never prunes it
      # (v0.1.0-phase0 validates artifacts.retain_passing but does not apply
      # it). The copy is what gets scanned, shown and kept, so nothing under
      # .prothesis/ is rewritten.
      - name: Collect the run bundles
        if: ${{ !cancelled() }}
        working-directory: gate
        run: |
          if [ -d .prothesis/runs ]; then
            mkdir -p "$RUNNER_TEMP/gate-bundles"
            cp -R .prothesis/runs/. "$RUNNER_TEMP/gate-bundles/"
            echo "GATE_BUNDLES=$RUNNER_TEMP/gate-bundles" >> "$GITHUB_ENV"
          fi

      # The repository is public, so bundlescan first redacts the tokens a run
      # creates, and fails here if it finds a real secret. Each refusal is an
      # annotation with its file and line, never the value.
      - name: Scan the run bundles for secrets
        id: scan
        if: ${{ !cancelled() && env.GATE_BUNDLES != '' }}
        working-directory: gate
        run: go run ./cmd/bundlescan -dir "$GATE_BUNDLES"

      # From the scanned copy, so the log shows nothing the scan would not
      # publish. If the scan refused, its annotations are the diagnostics.
      - name: Show verdicts, driver, app and worker logs on failure
        if: ${{ failure() && steps.scan.outcome == 'success' }}
        run: |
          cd "$GATE_BUNDLES"
          for v in */verdict.json; do [ -f "$v" ] || continue; echo "== $v"; cat "$v"; done
          # Each oracle's own verdict and account, which verdict.json does not carry.
          for r in */world-*/result.json; do [ -f "$r" ] || continue; echo "== $r"; jq -r '.oracles[] | "\(.oracle): \(.status) -- \(.explanation)"' "$r"; done
          # The driver's own account of each world: what it found, and its op counts.
          for d in */world-*/driver.log; do [ -f "$d" ] || continue; echo "== $d"; tail -n 40 "$d"; done
          for l in */world-*/logs/app.log */world-*/logs/worker-*.log; do
            [ -f "$l" ] || continue
            echo "== $l"; tail -n 80 "$l"
          done

      # Every world's bundle, kept for a recount and for anyone checking a
      # verdict.
      - name: Keep the run bundles
        if: ${{ !cancelled() && steps.scan.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gate-runs-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.GATE_BUNDLES }}
          retention-days: 30
          if-no-files-found: ignore
