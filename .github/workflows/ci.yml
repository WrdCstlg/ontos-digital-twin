name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The semantic engine the live integration tests run against. Keep in step
  # with the image pinned in compose.yaml.
  ENGINE_VERSION: v1.3.0
  ENGINE_SHA256: fbd13aab727b575ddc046e5571fce29d7612632c470ce4d50285ff036dc621b0

jobs:
  verify:
    name: Typecheck, lint, test, build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # 22 is the oldest supported LTS; 24 is what the Docker image runs.
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm --prefix app ci

      - name: Fetch semantic engine
        run: |
          mkdir -p bin
          curl -fsSL -o bin/open-ontologies \
            "https://github.com/fabio-rovai/open-ontologies/releases/download/${ENGINE_VERSION}/open-ontologies-x86_64-unknown-linux-gnu"
          echo "${ENGINE_SHA256}  bin/open-ontologies" | sha256sum --check --strict -
          chmod +x bin/open-ontologies

      - name: Typecheck
        run: npm --prefix app run check

      - name: Lint
        run: npm --prefix app run lint

      - name: Test
        run: npm --prefix app test
        env:
          # The engine tests spawn the daemon from this binary themselves, and
          # the engine host's live tests their engines. With CI set, a missing
          # binary fails the host's live tests rather than skipping them.
          OPEN_ONTOLOGIES_BIN: ${{ github.workspace }}/bin/open-ontologies

      - name: Build
        run: npm --prefix app run build

  mysql:
    name: Server tests on MySQL 8.4
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        # The image compose.yaml pins. The server lives only as long as this job
        # and listens only on the runner, so its password is no secret.
        image: mysql:8.4@sha256:85b9bf2e29cf836ecb8c2a15a935d4ba0c606631dff1dd79531a11983c638f2a
        env:
          MYSQL_ROOT_PASSWORD: ci-throwaway
          # Sessions at +05:00, not UTC (POSIX TZ: PKT-5 is five hours ahead), so
          # a time taken from the app's clock where the database's belongs shows.
          TZ: PKT-5
        ports:
          - 127.0.0.1:3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
      mosquitto:
        # An MQTT broker for the IoT consumer's tests: a persistent session
        # handed from one consumer to the next. Its image's own configuration
        # takes anonymous clients on 1883; it listens only on the runner.
        image: eclipse-mosquitto:2.1.2-alpine@sha256:38c0da4f2ef84284d47b3b3eeea1cb3bdeabe81ee10caf0cd5c5ff61ee3ea408
        ports:
          - 127.0.0.1:1883:1883
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm --prefix app ci

      # A schema.ts change committed without its migration: drizzle-kit would
      # generate one. It connects to nothing, but its config wants a URL.
      # drizzle-kit exits 0 when it fails (it cannot ask whether a column was
      # renamed without a terminal, for one), so only its all-clear passes.
      - name: The schema has every migration it needs
        working-directory: app
        env:
          DATABASE_URL: mysql://unused@127.0.0.1:1/unused
        run: |
          out="$(timeout 120 npx drizzle-kit generate 2>&1)" || { echo "$out"; exit 1; }
          echo "$out"
          drift="$(git status --porcelain -- db/migrations)"
          if [ -n "$drift" ] || ! grep -q "No schema changes, nothing to migrate" <<< "$out"; then
            echo "$drift"
            echo "::error::db/schema.ts differs from its migrations, or drizzle-kit could not tell: run npm run db:generate and commit what it writes"
            exit 1
          fi

      - name: Test on MySQL
        run: npm --prefix app run test:mysql
        env:
          ONTOS_TEST_DATABASE_URL: mysql://root:ci-throwaway@127.0.0.1:3306
          # The zone the service's TZ puts its sessions in: setup fails if not.
          ONTOS_TEST_SESSION_TIME_ZONE: "+05:00"
          # Set, the broker tests run, and fail if it does not answer.
          ONTOS_TEST_MQTT_URL: mqtt://127.0.0.1:1883

  docker:
    name: Docker stack boots and serves
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate throwaway secrets
        run: |
          admin_password="$(openssl rand -hex 12)"
          echo "::add-mask::${admin_password}"
          {
            echo "APP_SECRET=$(openssl rand -hex 32)"
            echo "MYSQL_PASSWORD=$(openssl rand -hex 24)"
            echo "MYSQL_ROOT_PASSWORD=$(openssl rand -hex 24)"
            echo "ADMIN_PASSWORD=${admin_password}"
          } > .env
          echo "ADMIN_PASSWORD=${admin_password}" >> "$GITHUB_ENV"

      - name: Build and start the stack
        run: docker compose up --detach --build

      # The app image carries the engine binary for the engine host. Its
      # self-test starts one scratch engine from it, loads three triples,
      # checks them with SHACL and runs a reasoning dry run.
      - name: The engine host's self-test passes in the app image
        run: docker compose run --rm --no-deps app node dist/engineHost.js --self-test

      - name: Wait for the app to report healthy
        run: |
          for _ in $(seq 1 90); do
            if curl -fsS http://localhost:3000/health > /dev/null 2>&1; then
              echo "app is up"
              exit 0
            fi
            sleep 2
          done
          echo "app did not become healthy within 180s" >&2
          exit 1

      - name: Smoke test
        run: |
          set -euo pipefail
          base=http://localhost:3000

          health="$(curl -fsS "$base/health")"
          echo "health: $health"
          test "$(jq -r .database <<< "$health")" = connected
          test "$(jq -r .semanticEngine.status <<< "$health")" = connected

          # Persona login must be refused in production by default.
          status="$(curl -s -o /dev/null -w '%{http_code}' -X POST "$base/api/trpc/auth.demoLogin" \
            -H 'content-type: application/json' -d '{"json":{"role":"admin"}}')"
          test "$status" = 403

          # The provisioned admin account signs in, and no password hash leaks.
          body="$(jq -nc --arg pw "$ADMIN_PASSWORD" '{json:{email:"admin@acme-ontology.com",password:$pw}}')"
          login="$(curl -fsS -c jar -X POST "$base/api/trpc/auth.login" \
            -H 'content-type: application/json' -d "$body")"
          test "$(jq -r .result.data.json.role <<< "$login")" = admin
          if grep -q passwordHash <<< "$login"; then echo "password hash leaked" >&2; exit 1; fi

          # First boot seeded the demo workspace.
          kpis="$(curl -fsS -b jar "$base/api/trpc/dashboard.overview" | jq -c .result.data.json.kpis)"
          echo "kpis: $kpis"
          test "$(jq -r .totalNodes <<< "$kpis")" = 3627
          test "$(jq -r .totalEdges <<< "$kpis")" = 7739

          # An import is queued by the app and run by the worker. Queue one and
          # wait for the worker to finish it against the real database.
          sync="$(curl -fsS -b jar -X POST "$base/api/trpc/mapping.runSync" \
            -H 'content-type: application/json' -d '{"json":{"mappingId":1}}')"
          job="$(jq -r .result.data.json.jobId <<< "$sync")"
          echo "queued job $job"
          status=queued
          for _ in $(seq 1 60); do
            input="$(jq -rn --argjson id "$job" '{json:{jobId:$id}}|@uri')"
            status="$(curl -fsS -b jar "$base/api/trpc/operations.getJob?input=$input" | jq -r .result.data.json.status)"
            if [ "$status" = succeeded ] || [ "$status" = failed ]; then break; fi
            sleep 2
          done
          echo "job $job: $status"
          test "$status" = succeeded

      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down --volumes

  e2e:
    name: Browser end-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The tests sign in through the one-click personas, which production
      # refuses unless ALLOW_DEMO_LOGIN is on.
      - name: Generate throwaway secrets
        run: |
          admin_password="$(openssl rand -hex 12)"
          echo "::add-mask::${admin_password}"
          {
            echo "APP_SECRET=$(openssl rand -hex 32)"
            echo "MYSQL_PASSWORD=$(openssl rand -hex 24)"
            echo "MYSQL_ROOT_PASSWORD=$(openssl rand -hex 24)"
            echo "ADMIN_PASSWORD=${admin_password}"
            echo "ALLOW_DEMO_LOGIN=true"
          } > .env

      - name: Build and start the stack
        run: docker compose up --detach --build

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm --prefix app ci

      - name: Install Chromium
        run: npx --prefix app playwright install --with-deps chromium

      - name: Wait for the app to report healthy
        run: |
          for _ in $(seq 1 90); do
            if curl -fsS http://localhost:3000/health > /dev/null 2>&1; then
              echo "app is up"
              exit 0
            fi
            sleep 2
          done
          echo "app did not become healthy within 180s" >&2
          exit 1

      - name: Run the browser tests
        run: npm --prefix app run test:e2e
        env:
          BASE_URL: http://localhost:3000
          CI: "true"

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            app/playwright-report/
            app/test-results/
          retention-days: 14

      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down --volumes
