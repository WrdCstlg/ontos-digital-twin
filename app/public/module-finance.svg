<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <!-- Finance module glyph: ledger grid of nodes with two flowing edge streams, amber line-art -->
  <g stroke="#FBBF24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <!-- ledger grid frame -->
    <rect x="72" y="88" width="256" height="224" rx="10" opacity="0.5"/>
    <path d="M72 152 h256 M72 232 h256 M160 88 v224 M256 88 v224" opacity="0.3"/>
    <!-- grid nodes -->
    <circle cx="72" cy="88" r="5" opacity="0.85"/>
    <circle cx="160" cy="88" r="5" opacity="0.85"/>
    <circle cx="256" cy="88" r="5" opacity="0.85"/>
    <circle cx="328" cy="88" r="5" opacity="0.85"/>
    <circle cx="72" cy="152" r="5" opacity="0.85"/>
    <circle cx="328" cy="152" r="5" opacity="0.85"/>
    <circle cx="72" cy="232" r="5" opacity="0.85"/>
    <circle cx="328" cy="232" r="5" opacity="0.85"/>
    <circle cx="72" cy="312" r="5" opacity="0.85"/>
    <circle cx="160" cy="312" r="5" opacity="0.85"/>
    <circle cx="256" cy="312" r="5" opacity="0.85"/>
    <circle cx="328" cy="312" r="5" opacity="0.85"/>
    <!-- flowing stream 1 (solid) -->
    <path d="M40 190 C 110 150, 170 214, 232 186 C 280 164, 320 178, 362 158" opacity="0.95"/>
    <circle cx="160" cy="199" r="6" fill="#FBBF24" stroke="none"/>
    <circle cx="288" cy="169" r="6" fill="#FBBF24" stroke="none"/>
    <!-- flowing stream 2 (dashed) -->
    <path d="M40 262 C 120 300, 190 246, 258 272 C 306 290, 336 272, 362 284" stroke-dasharray="8 7" opacity="0.7"/>
    <circle cx="204" cy="261" r="5" fill="#FBBF24" stroke="none"/>
  </g>
</svg>
